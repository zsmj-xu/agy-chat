<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>双子对话台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ground:#f4f5f7; --surface:#ffffff; --surface-2:#eef0f3;
    --ink:#1a1d23; --muted:#5c6572; --faint:#8b95a3; --border:#e0e3e8;
    --claude:#bd5233; --claude-soft:#f7e7e0;
    --agy:#3457c9; --agy-soft:#e3e9fb;
    --ff-display:"Bricolage Grotesque","PingFang SC","Microsoft YaHei",sans-serif;
    --ff-body:"IBM Plex Sans","PingFang SC","Microsoft YaHei",sans-serif;
    --ff-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
    --accent:var(--claude); --accent-soft:var(--claude-soft);
  }
  @media (prefers-color-scheme:dark){
    :root{
      color-scheme:dark;
      --ground:#111318; --surface:#1a1d23; --surface-2:#23272f;
      --ink:#e9ebef; --muted:#9aa4b2; --faint:#69737f; --border:#2c313a;
      --claude:#e5825b; --claude-soft:#38231a;
      --agy:#7690f6; --agy-soft:#1b243f;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ff-body);
    font-size:15px;line-height:1.6;display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top,0);}
  [data-agent="agy"]{--accent:var(--agy);--accent-soft:var(--agy-soft);}

  /* header */
  header{flex:none;border-bottom:1px solid var(--border);background:var(--surface);
    padding:12px clamp(14px,4vw,28px);display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .brand{font-family:var(--ff-display);font-weight:700;font-size:1.15rem;letter-spacing:-.01em;}
  .brand .c{color:var(--claude);} .brand .x{color:var(--faint);margin:0 2px;} .brand .a{color:var(--agy);}
  .spacer{flex:1}
  .switch{display:flex;gap:4px;background:var(--surface-2);border-radius:11px;padding:4px;}
  .switch button{font-family:var(--ff-mono);font-size:.82rem;border:0;background:transparent;color:var(--muted);
    padding:7px 15px;border-radius:8px;cursor:pointer;font-weight:500;transition:.15s;}
  .switch button.on[data-a="claude"]{background:var(--claude);color:#fff;}
  .switch button.on[data-a="agy"]{background:var(--agy);color:#fff;}
  select{font-family:var(--ff-mono);font-size:.8rem;padding:7px 10px;border-radius:9px;
    border:1px solid var(--border);background:var(--surface);color:var(--ink);cursor:pointer;}
  select:disabled{opacity:.4;cursor:not-allowed;}

  /* messages */
  main{flex:1;overflow-y:auto;padding:clamp(14px,4vw,28px);}
  .thread{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}
  .empty{color:var(--faint);text-align:center;margin-top:14vh;font-size:.95rem;}
  .empty .big{font-family:var(--ff-display);font-size:1.4rem;color:var(--muted);margin-bottom:6px;}
  .msg{display:flex;gap:11px;max-width:100%;}
  .msg .av{flex:none;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    font-family:var(--ff-mono);font-size:.72rem;font-weight:600;margin-top:2px;}
  .msg.bot .av{background:var(--accent-soft);color:var(--accent);}
  .msg.me{flex-direction:row-reverse;}
  .msg.me .av{background:var(--surface-2);color:var(--muted);}
  .bubble{border-radius:13px;padding:11px 15px;white-space:pre-wrap;word-break:break-word;
    font-size:.95rem;min-width:0;}
  .msg.bot .bubble{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);}
  .msg.me .bubble{background:var(--accent-soft);color:var(--ink);}
  .msg.bot .bubble.wait::after{content:"▋";color:var(--accent);animation:blink 1s steps(2) infinite;}
  @keyframes blink{50%{opacity:0}}

  /* composer */
  footer{flex:none;border-top:1px solid var(--border);background:var(--surface);
    padding:12px clamp(14px,4vw,28px);padding-bottom:calc(12px + env(safe-area-inset-bottom,0));}
  .composer{max-width:820px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;}
  textarea{flex:1;resize:none;border:1px solid var(--border);border-radius:12px;padding:11px 14px;
    font-family:var(--ff-body);font-size:.95rem;line-height:1.5;background:var(--ground);color:var(--ink);
    max-height:180px;min-height:46px;}
  textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent;}
  .send{flex:none;border:0;border-radius:12px;background:var(--accent);color:#fff;font-family:var(--ff-display);
    font-weight:600;font-size:.95rem;padding:0 20px;height:46px;cursor:pointer;}
  .send:disabled{opacity:.45;cursor:not-allowed;}
  .hint{max-width:820px;margin:6px auto 0;color:var(--faint);font-size:.72rem;font-family:var(--ff-mono);}
</style>
</head>
<body data-agent="claude">
  <header>
    <div class="brand"><span class="c">Claude</span><span class="x">×</span><span class="a">agy</span></div>
    <div class="spacer"></div>
    <div class="switch" id="switch">
      <button data-a="claude" class="on">Claude</button>
      <button data-a="agy">agy</button>
    </div>
    <select id="model" disabled title="agy 模型"></select>
  </header>

  <main id="main">
    <div class="thread" id="thread"></div>
  </main>

  <footer>
    <div class="composer">
      <textarea id="input" placeholder="给 Claude 发消息…  (Enter 发送，Shift+Enter 换行)" rows="1"></textarea>
      <button class="send" id="send">发送</button>
    </div>
    <div class="hint" id="hint">Claude · anthropic SDK · opus-4-8</div>
  </footer>

<script>
const S = {
  agent: "claude",
  model: null,
  agyModels: ["gemini-3.8-flash-high"],
  threads: { claude: [], agy: [] },
  busy: false,
};
const $ = s => document.querySelector(s);
const thread = $("#thread"), input = $("#input"), sendBtn = $("#send"),
      modelSel = $("#model"), hint = $("#hint");

// 载入 agy 模型列表
fetch("/config").then(r=>r.json()).then(c=>{
  S.agyModels = c.agyModels || S.agyModels;
  S.model = c.defaultAgyModel || S.agyModels[0];
  modelSel.innerHTML = S.agyModels.map(m=>`<option value="${m}">${m}</option>`).join("");
  modelSel.value = S.model;
}).catch(()=>{});

// agent 切换
$("#switch").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b || S.busy) return;
  S.agent = b.dataset.a;
  document.body.dataset.agent = S.agent;
  [...$("#switch").children].forEach(x=>x.classList.toggle("on", x.dataset.a===S.agent));
  modelSel.disabled = S.agent!=="agy";
  input.placeholder = S.agent==="agy" ? "给 agy 发消息…  (Enter 发送)" : "给 Claude 发消息…  (Enter 发送)";
  updateHint();
  render();
});
modelSel.addEventListener("change", ()=>{ S.model = modelSel.value; updateHint(); });

function updateHint(){
  hint.textContent = S.agent==="agy"
    ? `agy · CLI (OAuth) · ${S.model}`
    : "Claude · anthropic SDK · opus-4-8";
}

// 自适应高度
input.addEventListener("input", ()=>{ input.style.height="auto"; input.style.height=Math.min(input.scrollHeight,180)+"px"; });
input.addEventListener("keydown", e=>{
  if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); }
});
sendBtn.addEventListener("click", send);

function esc(){}
function render(){
  const list = S.threads[S.agent];
  if(list.length===0){
    thread.innerHTML = `<div class="empty"><div class="big">${S.agent==="agy"?"agy · Gemini":"Claude · Opus"}</div>开始对话吧</div>`;
    return;
  }
  thread.innerHTML = "";
  for(const m of list){
    thread.appendChild(bubble(m.role, m.content));
  }
  scrollDown();
}
function bubble(role, text){
  const wrap = document.createElement("div");
  wrap.className = "msg " + (role==="user" ? "me" : "bot");
  const av = document.createElement("div");
  av.className = "av";
  av.textContent = role==="user" ? "你" : (S.agent==="agy" ? "G" : "C");
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  wrap.append(av, b);
  return wrap;
}
function scrollDown(){ $("#main").scrollTop = $("#main").scrollHeight; }

async function send(){
  const text = input.value.trim();
  if(!text || S.busy) return;
  S.busy = true; sendBtn.disabled = true;
  const agent = S.agent, model = S.model;
  const history = S.threads[agent].slice();   // 之前的完整轮次

  // 上屏用户消息
  S.threads[agent].push({role:"user", content:text});
  input.value=""; input.style.height="auto";
  render();

  // 助手气泡（流式填充）
  const botWrap = bubble("assistant", "");
  const botBubble = botWrap.querySelector(".bubble");
  botBubble.classList.add("wait");
  thread.appendChild(botWrap); scrollDown();

  let acc = "";
  try{
    const resp = await fetch("/api/chat", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({agent, model, message:text, history})
    });
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      acc += dec.decode(value, {stream:true});
      botBubble.classList.remove("wait");
      botBubble.textContent = acc;
      scrollDown();
    }
  }catch(err){
    acc += `\n\n[连接出错] ${err}`;
    botBubble.textContent = acc;
  }
  botBubble.classList.remove("wait");
  S.threads[agent].push({role:"assistant", content: acc || "(空)"});
  S.busy = false; sendBtn.disabled = false;
  input.focus();
}

updateHint();
render();
</script>
</body>
</html>
